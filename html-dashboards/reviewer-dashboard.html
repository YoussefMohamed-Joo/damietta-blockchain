<!DOCTYPE html>
<html lang="en">
<!-- ===== HEADER (see partials/header.html) ===== -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviewer Dashboard - Damietta IP Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="layout">
    <!-- ===== SIDEBAR (injected from layout.js) ===== -->
    <div id="sidebar-root"></div>

    <div class="main-wrap">
      <!-- ===== NAVBAR (injected from layout.js) ===== -->
      <div id="navbar-root"></div>

      <!-- ===== CONTENT ===== -->
      <main class="main-content">

        <!-- ---- Dashboard ---- -->
        <section data-section="dashboard">
          <div class="grid-stats">
            <div class="card-white"><div class="stat-value" style="color:#2563EB;">12</div><div class="stat-label">Pending Reviews</div></div>
            <div class="card-white"><div class="stat-value" style="color:#14B8A6;">48</div><div class="stat-label">Completed</div></div>
            <div class="card-white"><div class="stat-value" style="color:#F59E0B;">3</div><div class="stat-label">Revisions Needed</div></div>
            <div class="card-white"><div class="stat-value" style="color:#8B5CF6;">2.4d</div><div class="stat-label">Avg. Review Time</div></div>
          </div>

          <div class="card-white">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
              <h3 class="fs-6 fw-bold mb-0" style="color:var(--text-dark);">Assigned Reviews</h3>
            </div>
            <div class="table-scroll">
              <table class="table-dash">
                <thead>
                  <tr><th>ID</th><th>Student</th><th>Title</th><th>Department</th><th>Status</th><th>Date</th><th>Action</th></tr>
                </thead>
                <tbody id="reviews-body"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- ---- My Reviews ---- -->
        <section data-section="reviews" style="display:none;">
          <div class="card-white">
            <h3 class="fs-6 fw-bold mb-4" style="color:var(--text-dark);">My Completed Reviews</h3>
            <div id="my-reviews-list" class="d-flex flex-column" style="gap:1rem;"></div>
          </div>
        </section>

        <!-- ---- Feedback ---- -->
        <section data-section="feedback" style="display:none;">
          <div class="card-white">
            <h3 class="fs-6 fw-bold mb-4" style="color:var(--text-dark);">Feedback Overview</h3>
            <div id="feedback-list" class="d-flex flex-column" style="gap:1rem;"></div>
          </div>
        </section>

      </main>
    </div>
  </div>

  <!-- ===== FOOTER (see partials/footer.html) ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.DASHBOARD = {
      role: 'reviewer', active: 'dashboard', title: 'Review Dashboard',
      name: 'Reviewer Panel', subtitle: 'Faculty Reviewer', initials: 'RK'
    };
  </script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/reviewer.js"></script>
</body>
</html>
