<!DOCTYPE html>
<html lang="en">
<!-- ===== HEADER (see partials/header.html) ===== -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs - Damietta IP Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="layout">
    <!-- ===== SIDEBAR (injected from layout.js) ===== -->
    <div id="sidebar-root"></div>

    <div class="main-wrap">
      <!-- ===== NAVBAR (injected from layout.js) ===== -->
      <div id="navbar-root"></div>

      <!-- ===== CONTENT ===== -->
      <main class="main-content">
        <div class="card-glass">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
              <h3 class="fs-6 fw-bold mb-1" style="color:var(--text-dark);"><i class="bi bi-clipboard-data me-2"></i>Audit Logs</h3>
              <div style="font-size:.8rem;color:var(--text-muted);">Immutable record of actions across the platform. Data is dummy for demonstration.</div>
            </div>
            <div class="d-flex align-items-center flex-wrap" style="gap:8px;">
              <select id="audit-status-filter" class="form-select-dash" style="width:auto;padding:8px 12px;" onchange="renderAuditLogs()">
                <option>All Status</option>
                <option>Success</option>
                <option>Info</option>
                <option>Warning</option>
                <option>Danger</option>
              </select>
              <select id="audit-action-filter" class="form-select-dash" style="width:auto;padding:8px 12px;" onchange="renderAuditLogs()">
                <option>All Actions</option>
                <option>User Login</option>
                <option>User Login Failed</option>
                <option>Research Submitted</option>
                <option>Research Approved</option>
                <option>Revision Requested</option>
                <option>Certificate Issued</option>
                <option>Password Reset</option>
                <option>Settings Updated</option>
              </select>
              <button class="btn-primary-dash btn-sm-dash" onclick="dummyDownload('audit-logs.csv')"><i class="bi bi-download"></i> Export</button>
            </div>
          </div>

          <div class="table-scroll">
            <table class="table-dash">
              <thead>
                <tr><th>Log ID</th><th>Action</th><th>User</th><th>Role</th><th>IP Address</th><th>Timestamp</th><th>Status</th></tr>
              </thead>
              <tbody id="audit-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- ===== FOOTER (see partials/footer.html) ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.DASHBOARD = {
      role: 'admin', active: 'audit', title: 'Audit Logs',
      name: 'IP Portal', subtitle: 'Admin Panel', initials: 'AK', logo: '/img/logo.png'
    };
  </script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/audit-logs.js"></script>
</body>
</html>
