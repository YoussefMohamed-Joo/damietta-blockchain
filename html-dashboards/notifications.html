<!DOCTYPE html>
<html lang="en">
<!-- ===== HEADER (see partials/header.html) ===== -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Damietta IP Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="layout">
    <!-- ===== SIDEBAR (injected from layout.js) ===== -->
    <div id="sidebar-root"></div>

    <div class="main-wrap">
      <!-- ===== NAVBAR (injected from layout.js) ===== -->
      <div id="navbar-root"></div>

      <!-- ===== CONTENT ===== -->
      <main class="main-content">
        <div class="card-glass">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
              <h3 class="fs-6 fw-bold mb-1" style="color:var(--text-dark);"><i class="bi bi-bell me-2"></i>Notifications</h3>
              <div style="font-size:.8rem;color:var(--text-muted);" id="unread-count"></div>
            </div>
            <button class="btn-primary-dash btn-sm-dash" onclick="markAllRead()"><i class="bi bi-check2-all"></i> Mark all as read</button>
          </div>
          <div id="notif-list" class="d-flex flex-column" style="gap:.5rem;"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- ===== FOOTER (see partials/footer.html) ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.DASHBOARD = {
      role: 'admin', active: 'notifications', title: 'Notifications',
      name: 'IP Portal', subtitle: 'Admin Panel', initials: 'AK', logo: '/img/logo.png'
    };
  </script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/notifications.js"></script>
</body>
</html>
